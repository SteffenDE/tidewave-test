name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event.sender.login == 'SteffenDE' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Start the server on the PR code, not the default branch, so it matches what Claude checks out
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.sha || '' }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-dev-

      - name: Set up the app
        run: mix setup

      # Tidewave is a dev-only dependency, so the server runs in the dev environment
      - name: Start the app
        run: mix phx.server > app.log 2>&1 &

      - name: Connect Tidewave
        id: tidewave
        uses: tidewave-ai/connect-action@v1
        with:
          app_url: http://localhost:4000
          api_key: ${{ secrets.TIDEWAVE_API_KEY }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_COMMENT_TOKEN: ${{ secrets.GH_COMMENT_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Uncomment to use API key instead
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --mcp-config '{"mcpServers": {"tidewave": {"type": "http", "url": "${{ steps.tidewave.outputs.mcp_url }}"}}}'
            --allowedTools 'mcp__tidewave,Bash(mix:*),Bash(MIX_ENV=test mix:*),Bash(GH_TOKEN=$GH_COMMENT_TOKEN gh ${{ (github.event.issue.pull_request || github.event.pull_request) && 'pr' || 'issue' }} comment ${{ github.event.issue.number || github.event.pull_request.number }}:*)'
            --append-system-prompt 'The app is running at http://localhost:4000 with Tidewave. Use the Tidewave MCP tools to evaluate code in the app and to verify your changes in the browser. It reloads code changes automatically, so do not start another server with mix phx.server. Run mix precommit before you finish and fix any issues it reports.

            If you captured screenshots or recordings with Tidewave, save them under tmp/tidewave/ and, once you are done, post them in a separate comment with:

            GH_TOKEN=$GH_COMMENT_TOKEN gh ${{ (github.event.issue.pull_request || github.event.pull_request) && 'pr' || 'issue' }} comment ${{ github.event.issue.number || github.event.pull_request.number }} --body-file tmp/tidewave/report.md --attach <file> --attach <file>

            In the Markdown, reference each attached file by the same path you pass to --attach, such as ![The settings page](tmp/tidewave/screenshots/settings.png), and gh replaces it with the uploaded URL. To embed a video as a player, put its reference, such as ![](tmp/tidewave/recordings/flow.webm), alone in its own paragraph, otherwise it renders as a link. Skip this comment if there are no attachments.'

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          if-no-files-found: ignore
